<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IRR</title>
  <meta name="description" content="ดูผลตอบแทน IRR ของแบบประกันตามเพศ อายุ เบี้ยประกัน และฐานภาษี">
  <meta name="theme-color" content="#F2F9FE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IRR">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
  <!-- ════ อนิเมชันโลโก้ตอนเปิดแอป ════ -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-stage">
      <img class="lg lg-shadow" src="assets/logo/logo-shadow.png" alt="">
      <img class="lg lg-n" src="assets/logo/logo-n.png" alt="">
      <img class="lg lg-u" src="assets/logo/logo-u.png" alt="">
      <img class="lg lg-t" src="assets/logo/logo-t.png" alt="">
      <img class="lg lg-awut" src="assets/logo/logo-awut.png" alt="">
      <img class="lg lg-amapon" src="assets/logo/logo-amapon.png" alt="">
      <div class="burst" id="burst"><span class="ring"></span><span class="ring"></span><span class="ring"></span><span class="ring"></span></div>
    </div>
    <div class="splash-load" id="splashLoad"><span></span></div>
  </div>

  <svg class="page-art" viewBox="0 0 400 400" preserveAspectRatio="none" aria-hidden="true">
    <path class="pl pl1" d="M-10 390 C 70 380, 120 355, 170 320 S 270 245, 320 225 S 385 190, 410 170"/>
    <path class="pl pl2" d="M-10 400 C 90 395, 150 382, 210 360 S 310 310, 350 298 S 395 284, 410 280"/>
    <g class="pdots"><path d="M170 320h0"/><path d="M320 225h0"/></g>
  </svg>

  <main class="app" id="app">
    <header class="top">
      <div class="top-bg" aria-hidden="true">
        <svg class="top-art" viewBox="0 0 400 300" preserveAspectRatio="none">
                    <path class="ln ln1" d="M-10 262 C 90 258, 170 248, 240 230 S 335 178, 365 108 S 398 28, 412 -5"/>
          <path class="ln ln2" d="M-10 276 C 100 273, 190 264, 262 249 S 352 204, 382 150 S 404 104, 412 88"/>
          <path class="ln ln3" d="M-10 290 C 110 288, 210 282, 280 270 S 370 240, 412 205"/>
          <g class="dots"><path d="M365 108h0"/><path d="M382 150h0"/><path d="M398 40h0"/></g>
        </svg>
      </div>
      <h1 class="title">IRR</h1>
      <p class="lead">Internal Rate of Return</p>
      <p class="badge">กรุณาระบุข้อมูล เพื่อค้นหาผลตอบแทน</p>
    </header>

    <form class="card form" id="form" novalidate>
      <div class="field">
        <label for="product">แบบประกัน</label>
        <select id="product" disabled><option value="">กำลังโหลดข้อมูล…</option></select>
      </div>
      <div class="field">
        <label for="gender">เพศ</label>
        <select id="gender" disabled><option value="">เลือกแบบประกันก่อน</option></select>
      </div>
      <div class="field">
        <label for="age">อายุ</label>
        <select id="age" disabled><option value="">เลือกเพศก่อน</option></select>
      </div>
      <div class="field">
        <label for="premium">เบี้ยประกัน (ต่อปี)</label>
        <select id="premium" disabled><option value="">เลือกอายุก่อน</option></select>
      </div>
      <div class="field">
        <label for="tax">ฐานภาษี</label>
        <select id="tax">
          <option value="">เลือกฐานภาษี</option>
          <option value="0">0%</option>
          <option value="5">5%</option>
          <option value="10">10%</option>
          <option value="15">15%</option>
          <option value="20">20%</option>
          <option value="25">25%</option>
          <option value="30">30%</option>
          <option value="35">35%</option>
        </select>
      </div>
      <button class="btn" id="calc" type="submit" disabled><span>คำนวณ IRR</span></button>
      <p class="err" id="loadErr" hidden></p>
    </form>

    <section class="card result" id="result" hidden aria-live="polite"></section>

    <section class="print-cta" id="printCta" hidden>
      <button class="btn btn--ghost" id="printBtn" type="button"><span>One Page · พิมพ์ / บันทึก PDF</span></button>
      <p class="print-msg" id="printMsg" hidden></p>
    </section>

    <footer class="foot">
      <img class="foot-logo" src="assets/logo/logo-full.png" alt="Nutawut Tamapon" width="1200" height="328">
      <p id="foot"></p>
    </footer>
  </main>

  <!-- ════ หน้าสรุป A4 (ดูตัวอย่างบนจอ + ใช้ตอนพิมพ์) ════ -->
  <div class="ps-overlay" id="psOverlay" hidden>
    <div class="ps-bar">
      <button class="btn" id="psPdf" type="button"><span>บันทึก PDF</span></button>
      <button class="ps-close" id="psPrint" type="button">พิมพ์</button>
      <button class="ps-close" id="psClose" type="button">ปิด</button>
    </div>
    <div class="ps-fit"><article class="ps" id="psSheet"></article></div>
  </div>

  <script src="config.js?v=11"></script>
  <script src="mock-data.js?v=11"></script>
  <script src="print.js?v=11"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
